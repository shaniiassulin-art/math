<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="theme-color" content="#1F2A47">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231F2A47%22/%3E%3Cpath d=%22M38 13.5C32 11 28 15 28 23v18c0 8-4 11-9 9.5%22 fill=%22none%22 stroke=%22%23E3B95C%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2242%22 cy=%2214.5%22 r=%224%22 fill=%22%23E3B95C%22/%3E%3Ccircle cx=%2216%22 cy=%2250%22 r=%224%22 fill=%22%23E3B95C%22/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="מתמטיקה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EE; --paper:#FFFFFF; --ink:#23262B; --ink-soft:#5B5F6B; --line:#E4DECF;
    --indigo:#2C3A5E; --indigo-2:#1F2A47; --indigo-soft:#EDF0F7;
    --gold:#A8791E; --gold-light:#E3B95C; --gold-soft:#FBF3DF; --gold-text:#7A5610;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Assistant', system-ui, 'Arial Hebrew', Arial, sans-serif;
    font-size:17px; line-height:1.7; overflow-wrap:break-word;
  }
  h1,h2{ font-family:'Frank Ruhl Libre', 'David', 'Times New Roman', serif; color:var(--indigo-2); line-height:1.25; margin:0; }

  .top{
    background:linear-gradient(180deg, var(--indigo-2), var(--indigo));
    color:#FAF6EE;
    padding:calc(40px + env(safe-area-inset-top, 0px)) 16px 44px;
  }
  .top-inner, main, footer{ max-width:960px; margin:0 auto; }
  .top h1{ color:#fff; font-size:clamp(1.9rem, 6vw, 2.6rem); font-weight:700; }
  .top p{ color:#E4DBBE; margin:10px 0 0; max-width:60ch; font-size:1.05rem; }
  .top .mark{ display:inline-block; width:44px; height:44px; margin-bottom:14px; }

  main{ padding:8px 16px 64px; }
  .course{ margin-top:40px; }
  .course h2{
    font-size:1.5rem; display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .course h2::after{ content:""; flex:1; height:1px; background:var(--line); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:16px; }
  .site-card{
    display:flex; flex-direction:column; gap:8px;
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    border-top:4px solid var(--gold);
    padding:20px 20px 18px; text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, transform .15s ease;
  }
  .site-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .site-card:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }
  .site-name{ font-family:'Frank Ruhl Libre', serif; font-weight:700; font-size:1.35rem; color:var(--indigo-2); }
  .site-desc{ color:var(--ink-soft); font-size:.98rem; }
  .site-units{ list-style:none; margin:4px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
  .site-units li{
    font-size:.85rem; line-height:1.4; padding:4px 10px; border-radius:100px;
    background:var(--indigo-soft); color:var(--indigo-2);
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .site-units li.more{ background:var(--gold-soft); color:var(--gold-text); }
  .site-meta{ font-size:.85rem; color:var(--ink-soft); margin-top:auto; padding-top:8px; }
  .site-go{
    align-self:flex-start; margin-top:4px; min-height:44px; display:inline-flex; align-items:center; gap:8px;
    padding:0 18px; border-radius:100px; background:var(--indigo-2); color:#fff; font-weight:700; font-size:.95rem;
  }
  .site-card:hover .site-go{ background:var(--indigo); }

  footer{ padding:0 16px calc(40px + env(safe-area-inset-bottom, 0px)); color:var(--ink-soft); font-size:.88rem; }

  @media (prefers-reduced-motion: reduce){ .site-card{ transition:none; } .site-card:hover{ transform:none; } }
</style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2C3A5E"/><path d="M38 13.5C32 11 28 15 28 23v18c0 8-4 11-9 9.5" fill="none" stroke="#E3B95C" stroke-width="4" stroke-linecap="round"/><circle cx="42" cy="14.5" r="4" fill="#E3B95C"/><circle cx="16" cy="50" r="4" fill="#E3B95C"/></svg>
      <h1>{{TITLE}}</h1>
      <p>{{SUBTITLE}}</p>
    </div>
  </header>
  <main>
{{GROUPS}}
  </main>
  <footer>כל אתר נטען מתוך המאגר שלו בגיטהאב ומתעדכן אוטומטית כשהמאגר משתנה.</footer>
</body>
</html>
