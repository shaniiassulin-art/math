name: סנכרון האתרים מהמאגרים

on:
  schedule:
    - cron: "*/15 * * * *"   # כל רבע שעה בערך (גיטהאב לפעמים מאחר בכמה דקות)
  workflow_dispatch:          # הרצה ידנית: Actions > סנכרון האתרים מהמאגרים > Run workflow
  push:
    branches: [main]
    paths: [sites.json, sync.py, hub_template.html]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: הורדת הגרסאות העדכניות ובניית האתר
        run: python3 sync.py
      - name: שמירה (רק אם משהו השתנה)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "סנכרון אוטומטי מהמאגרים"
            git push
          else
            echo "אין שינויים"
          fi
